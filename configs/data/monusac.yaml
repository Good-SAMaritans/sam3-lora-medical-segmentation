# configs/data/monusac.yaml — MoNuSAC nucleus segmentation (RGB H&E histopathology, multi-class)
#
# Labels: 0 background, 1 Epithelial, 2 Lymphocyte, 3 Macrophage, 4 Neutrophil, 5 Ambiguous.
# We train a 5-class model (0-4). Ambiguous has no train/val examples and is a
# don't-care region at test time (ignore_index: 5 in the experiment config).
#
# Splits are small: 188 train / 21 val / 101 test. The 21-image val split makes
# best-epoch checkpoint selection much noisier here than on BUSI (131 val).

# dataset identity / acquisition
name: monusac              # -> MonusacMSBench
size: 512                  # source resolution: 128 | 256 | 512. 512 to match the U-Net arm;
                           # nuclei are only a few pixels across, so Dice is resolution-sensitive
category: null
download: true             # fetches monusac_512.npz from Zenodo into `root` on first use
root: ~/.medsegbench

# data-efficiency subset (null = full train split; MoNuSAC train is only 188)
n_train: null
subset_seed: 0

# preprocessing
force_rgb: true            # MoNuSAC is already RGB, so this is a no-op here
img_size: 512
normalize: null            # null (/255); Sam3MedSeg applies SAM 3's own 0.5/0.5 internally

# augmentation (shared across arms)
aug_preset: medseg_default

# loader
batch_size: 1
num_workers: 4
pin_memory: true
seed: 42
