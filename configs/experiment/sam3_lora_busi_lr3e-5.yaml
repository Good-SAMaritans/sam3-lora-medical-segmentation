# LR sweep point 1/3: adapter lr 3e-5 (baseline 1e-4 = the existing busi_full run).
# Identical to sam3_lora_busi_full.yaml except backbone_lr and ckpt_dir.
data:
  name: busi
  size: 256
  img_size: 256
  normalize: null
  n_train: null                 # full train split (452 images), not the 8-image smoke subset
  batch_size: 1
  num_workers: 2                # parallel loading; safe now that the script has the __main__ guard
  aug_preset: medseg_default    # real augmentation (was "none" for the deterministic smoke test)
model:
  finetune_mode: lora
  num_classes: 1
train:
  epochs: 20
  backbone_lr: 3.0e-5           # = the adapter lr (adapters are the only trainable backbone params)
  head_lr: 1.0e-4
  ckpt_dir: checkpoints/sam3_lora_busi_lr3e-5
