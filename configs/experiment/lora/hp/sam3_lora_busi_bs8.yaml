# batch sweep point 1/3: bs=8 at FIXED lr 1e-4 (baseline bs=1 = the existing busi_full run).
# Identical to sam3_lora_busi_full.yaml except batch_size, num_workers, ckpt_dir.
# num_workers scaled with batch to keep the GPU fed — throughput knob only, no effect on optimization.
data:
  name: busi
  size: 512
  img_size: 512
  normalize: null
  n_train: null                 # full train split (452 images) -> 57 optimizer steps/epoch at bs=8
  batch_size: 8
  num_workers: 4
  aug_preset: medseg_default
model:
  finetune_mode: lora
  num_classes: 1
train:
  epochs: 20
  backbone_lr: 1.0e-4           # = the adapter lr; deliberately NOT scaled with batch in this sweep
  head_lr: 1.0e-4
  ckpt_dir: checkpoints/sam3_lora_busi_bs8_512
