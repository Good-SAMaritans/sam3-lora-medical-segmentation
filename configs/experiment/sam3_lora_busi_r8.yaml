# rank sweep point 2/3: r=8 (baseline r=4 = the existing busi_full run; alpha tied to r so alpha/r stays 1).
# Identical to sam3_lora_busi_full.yaml except lora_r/lora_alpha and ckpt_dir.
data:
  name: busi
  size: 256
  img_size: 256
  normalize: null
  n_train: null                 # full train split (452 images), not the 8-image smoke subset
  batch_size: 1
  num_workers: 2                # parallel loading; safe now that the script has the __main__ guard
  aug_preset: medseg_default    # real augmentation (was "none" for the deterministic smoke test)
model:
  finetune_mode: lora
  num_classes: 1
  lora_r: 8
  lora_alpha: 8
train:
  epochs: 20
  backbone_lr: 1.0e-4           # = the adapter lr; pinned at the baseline value for the rank sweep
  head_lr: 1.0e-4
  ckpt_dir: checkpoints/sam3_lora_busi_r8
