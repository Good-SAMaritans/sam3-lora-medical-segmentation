# SAM3 FULL fine-tuning on MoNuSAC (multiclass). Mirrors Nik's LoRA MoNuSAC config;
# only finetune_mode=full and backbone_lr=1e-5 differ. epochs 40 (188 train imgs).
data:
  name: monusac
  size: 512
  img_size: 512
  normalize: null
  n_train: null
  batch_size: 1
  num_workers: 4
  aug_preset: medseg_default
model:
  finetune_mode: full
  num_classes: 5
train:
  epochs: 40
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  ignore_index: 5
  ckpt_dir: /storage/ice1/4/1/skang411/checkpoints/sam3_full_monusac_full