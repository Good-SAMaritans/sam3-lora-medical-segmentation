# Smoke test for the MoNuSAC (multi-class) LoRA arm: 8 train images, 2 epochs.
#
# Exists to catch shape/dtype/loss errors on a GPU in ~2 minutes rather than 30
# minutes into the full run. It exercises the parts the synthetic check could not:
# the real data layer emitting (B,512,512) long masks, Sam3MedSeg building with
# 5 output channels, and CeDiceLoss + multiclass_scores over real MoNuSAC labels.
#
# aug_preset is medseg_default (not "none") on purpose, so elastic/CLAHE are
# exercised against index masks rather than only against binary ones.
#
#   sbatch scripts/slurm/train_lora.sbatch configs/experiment/sam3_lora_monusac_smoke.yaml
data:
  name: monusac
  size: 512
  img_size: 512
  normalize: null
  n_train: 8                    # deterministic subset (subset_seed default 0)
  batch_size: 1
  num_workers: 2
  aug_preset: medseg_default
model:
  finetune_mode: lora
  num_classes: 5
train:
  epochs: 2
  backbone_lr: 1.0e-4
  head_lr: 1.0e-4
  ignore_index: 5
  ckpt_dir: checkpoints/sam3_lora_monusac_smoke