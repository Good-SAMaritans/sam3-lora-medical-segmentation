name: unet_kvasir512

base:
  data:
    name: kvasir
    size: 512
    img_size: 512
    normalize: imagenet
    n_train: null
    batch_size: 8
    num_workers: 4
    aug_preset: medseg_default
  model:
    encoder_name: resnet34
    encoder_weights: imagenet
    in_channels: 3
    num_classes: 1
    finetune_mode: full
  train:
    epochs: 40
    backbone_lr: 1.0e-4
    head_lr: 1.0e-3
    weight_decay: 0.01
    out_dir: results
    keep_checkpoint: false

grid:
  model.encoder_name: [resnet34, resnet50, efficientnet-b0, mit_b0]
  model.encoder_weights: [imagenet, null]
  data.aug_preset: [medseg_default, none]
