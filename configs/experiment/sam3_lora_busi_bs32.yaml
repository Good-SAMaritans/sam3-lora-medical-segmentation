# batch sweep point 3/3: bs=32 at FIXED lr 1e-4 (baseline bs=1 = the existing busi_full run).
# Identical to sam3_lora_busi_full.yaml except batch_size, num_workers, ckpt_dir.
# num_workers scaled with batch to keep the GPU fed — throughput knob only, no effect on optimization.
# NOTE: activation memory grows ~linearly with batch; bs=32 at 1008x1008 fp32 may push
# 60GB+ peak — needs an H100-80GB, and an OOM here is itself a sweep data point.
data:
  name: busi
  size: 256
  img_size: 256
  normalize: null
  n_train: null                 # full train split (452 images) -> 14 optimizer steps/epoch at bs=32
  batch_size: 32
  num_workers: 8
  aug_preset: medseg_default
model:
  finetune_mode: lora
  num_classes: 1
train:
  epochs: 20
  backbone_lr: 1.0e-4           # = the adapter lr; deliberately NOT scaled with batch in this sweep
  head_lr: 1.0e-4
  ckpt_dir: checkpoints/sam3_lora_busi_bs32
