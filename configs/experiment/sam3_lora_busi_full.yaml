# full training run: SAM3 LoRA arm on the complete BUSI train split.
data:
  name: busi
  size: 256
  img_size: 256
  normalize: null
  n_train: null                 # full train split (452 images), not the 8-image smoke subset
  batch_size: 1
  num_workers: 2                # parallel loading; safe now that the script has the __main__ guard
  aug_preset: medseg_default    # real augmentation (was "none" for the deterministic smoke test)
model:
  finetune_mode: lora
  num_classes: 1
train:
  epochs: 20                    # ~1 hr/epoch on MPS; best.pt keeps the best-so-far, so a partial run is fine
  backbone_lr: 1.0e-4           # = the adapter lr (adapters are the only trainable backbone params)
  head_lr: 1.0e-4
  ckpt_dir: checkpoints/sam3_lora_busi_full   # separate dir, keeps the smoke checkpoint intact
